version: '3.8'

services:
  stagepilot-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stagepilot_app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CLIENT_URL=http://localhost:5173
      - MONGODB_URI=mongodb://mongo:27017/stagepilot
      - JWT_SECRET=stagepilot_ultra_secure_production_secret_key_2026
      - JWT_EXPIRES_IN=7d
      - AI_PROVIDER=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    container_name: stagepilot_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
